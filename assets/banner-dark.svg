<line class="b" x1="965" y1="330" x2="840" y2="395" stroke="#3fb6ff" stroke-width="2.5"/>
<line class="b" x1="840" y1="395" x2="690" y2="375" stroke="#3fb6ff" stroke-width="2.5"/>
<line class="b" x1="930" y1="220" x2="965" y2="330" stroke="#3fb6ff" stroke-width="2.5"/>
</g>
<g class="n0"><circle cx="891" cy="335" r="9" fill="#FFB100"/></g>
<g class="n1"><circle cx="830" cy="370" r="9" fill="#3fb6ff"/></g>
<g class="n2"><circle cx="769" cy="335" r="9" fill="#3fb6ff"/></g>
<g class="n3"><circle cx="769" cy="265" r="9" fill="#3fb6ff"/></g>
<g class="n4"><circle cx="830" cy="230" r="9" fill="#3fb6ff"/></g>
