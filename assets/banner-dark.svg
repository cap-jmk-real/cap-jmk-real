<line class="b" x1="700" y1="230" x2="800" y2="300" stroke="#3fb6ff" stroke-width="2.5"/>
<line class="b" x1="930" y1="220" x2="800" y2="300" stroke="#3fb6ff" stroke-width="2.5"/>
<line class="b" x1="965" y1="330" x2="800" y2="300" stroke="#3fb6ff" stroke-width="2.5"/>
