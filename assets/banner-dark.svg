<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-label="Julian M. Kleber, sail.black">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b22"/></linearGradient>
<radialGradient id="h"><stop offset="0" stop-color="#FFB100" stop-opacity=".35"/><stop offset="1" stop-color="#FFB100" stop-opacity="0"/></radialGradient></defs>
<style>
.b{stroke-dasharray:6 10;animation:p 2.4s linear infinite}
.t{transform-origin:0 0;animation:ty 3.5s steps(28) .6s both}
@keyframes m5{0%,25%{transform:translate(0,0)}75%,100%{transform:translate(-91px,35px)}}.n5{animation:m5 9s ease-in-out infinite alternate}
@keyframes m4{0%,25%{transform:translate(0,0)}75%,100%{transform:translate(-140px,145px)}}.n4{animation:m4 9s ease-in-out infinite alternate}
@keyframes m3{0%,25%{transform:translate(0,0)}75%,100%{transform:translate(71px,130px)}}.n3{animation:m3 9s ease-in-out infinite alternate}
@keyframes m2{0%,25%{transform:translate(0,0)}75%,100%{transform:translate(196px,-5px)}}.n2{animation:m2 9s ease-in-out infinite alternate}
@keyframes m1{0%,25%{transform:translate(0,0)}75%,100%{transform:translate(100px,-150px)}}.n1{animation:m1 9s ease-in-out infinite alternate}
@keyframes m0{0%,25%{transform:translate(0,0)}75%,100%{transform:translate(-191px,-105px)}}.n0{animation:m0 9s ease-in-out infinite alternate}
.c{animation:bl 1s step-end infinite}
.f{animation:fi 1.2s ease-out both}
@keyframes p{to{stroke-dashoffset:-32}}
@keyframes ty{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes bl{50%{opacity:0}}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
@keyframes fo{0%,25%{opacity:1}75%,100%{opacity:0}}@keyframes fo2{0%,25%{opacity:0}75%,100%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.t{transform:none}}
</style>
<rect width="1000" height="420" fill="url(#g)"/>
<circle cx="830" cy="300" r="190" fill="url(#h)"/>
<g class="mol" style="animation:fo 9s ease-in-out infinite alternate">
<line x1="891" y1="335" x2="830" y2="370" stroke="#9da7b3" stroke-width="3"/>
<line x1="830" y1="370" x2="769" y2="335" stroke="#9da7b3" stroke-width="3"/>
