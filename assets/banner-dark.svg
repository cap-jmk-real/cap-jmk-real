<line x1="891" y1="265" x2="891" y2="335" stroke="#9da7b3" stroke-width="3"/>
<circle cx="830" cy="300" r="36" fill="none" stroke="#9da7b3" stroke-width="2" stroke-dasharray="4 6"/>
</g>
